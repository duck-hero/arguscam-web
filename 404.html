<!DOCTYPE html>
<html lang="vi" prefix="og: https://ogp.me/ns#">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Không tìm thấy trang – ArgusCam</title>
<meta name="description" content="Trang bạn tìm không tồn tại hoặc đã được chuyển đi. Quay lại trang chủ ArgusCam.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#1B6CA8">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --xanh:#1B6CA8;
    --xanh-dam:#114E7E;
    --xanh-nhat:#EAF3FB;
    --xanh-vien:#C7E0F2;
    --den:#15212E;
    --xam:#566373;
    --trang:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    color:var(--den);
    background:linear-gradient(180deg,#EFF6FC 0%,#DCEBF7 55%,#fff 100%);
    line-height:1.6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  img{max-width:100%;display:block}
  a{text-decoration:none;color:inherit}
  .box{
    width:100%;
    max-width:560px;
    background:#fff;
    border:1px solid var(--xanh-vien);
    border-radius:24px;
    box-shadow:0 24px 60px rgba(27,108,168,.16);
    padding:48px 40px;
    text-align:center;
  }
  .box .logo{height:56px;width:auto;margin:0 auto 26px}
  .ma-loi{
    font-size:clamp(56px,14vw,88px);
    font-weight:800;
    line-height:1;
    color:var(--xanh);
    letter-spacing:-2px;
    margin-bottom:10px;
  }
  .box h1{font-size:clamp(20px,4.4vw,26px);font-weight:800;line-height:1.3;margin-bottom:12px}
  .box .mo-ta{color:var(--xam);font-size:15px;max-width:420px;margin:0 auto 30px}
  .nhom-nut{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .nut{
    display:inline-block;
    padding:14px 28px;
    border-radius:12px;
    font-weight:600;
    font-size:15px;
    transition:.2s;
  }
  .nut-xanh{background:var(--xanh);color:#fff;box-shadow:0 12px 26px rgba(27,108,168,.28)}
  .nut-xanh:hover{background:var(--xanh-dam);transform:translateY(-2px)}
  .nut-vien{background:#fff;color:var(--xanh-dam);border:1.5px solid var(--xanh)}
  .nut-vien:hover{background:var(--xanh-nhat)}
  .lien-ket{
    margin-top:34px;
    padding-top:24px;
    border-top:1px solid #E6EEF6;
  }
  .lien-ket h2{font-size:14px;font-weight:600;color:var(--xam);margin-bottom:14px}
  .lien-ket ul{list-style:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .lien-ket a{
    display:inline-block;
    background:var(--xanh-nhat);
    border:1px solid var(--xanh-vien);
    border-radius:999px;
    padding:8px 16px;
    font-size:14px;
    font-weight:600;
    color:var(--xanh-dam);
    transition:.2s;
  }
  .lien-ket a:hover{background:var(--xanh);color:#fff;border-color:var(--xanh)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="box">
    <a href="/"><img class="logo" src="/logo.png" alt="ArgusCam"></a>

    <div class="ma-loi">404</div>
    <h1>Không tìm thấy trang này</h1>
    <p class="mo-ta">Đường dẫn bạn truy cập không tồn tại hoặc đã được chuyển sang địa chỉ khác. Hãy thử quay lại trang chủ nhé.</p>

    <div class="nhom-nut">
      <a class="nut nut-xanh" href="/">Về trang chủ</a>
      <a class="nut nut-vien" href="/blog/">Xem bài viết</a>
    </div>

    <nav class="lien-ket">
      <h2>Hoặc tham khảo</h2>
      <ul>
        <li><a href="/blog/quay-video-dong-hang-bang-chung-khieu-nai.html">Quay video đóng hàng</a></li>
        <li><a href="/blog/chong-bom-hang-hieu-qua-cho-shop-online.html">Chống bom hàng</a></li>
        <li><a href="/privacy-policy.html">Chính sách bảo mật</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
